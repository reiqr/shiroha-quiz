name: Temporary minimal update package

on:
  push:
    branches:
      - deliver/minimal-update-20261003

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create minimal replacement ZIP
        run: |
          zip -r shiroha_quiz_native_minimal_update_20261003.zip \
            apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/app/ShirohaAppShell.kt \
            apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/ImportScreen.kt \
            apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/MeScreen.kt \
            apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/StandardImportFormatScreen.kt \
            apps/android/app/src/native/assets/docs/import_format_support.md \
            apps/android/app/src/native/assets/docs/import_parser_notes.md \
            apps/android/app/src/native/assets/docs/import_strategy_guide.md \
            apps/android/app/src/native/assets/docs/standard_format.md \
            apps/android/app/src/native/assets/templates/Shiroha_Quiz_Excel题库导入通用模板.xlsx

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: shiroha_quiz_native_minimal_update_20261003
          path: shiroha_quiz_native_minimal_update_20261003.zip
          if-no-files-found: error
          retention-days: 7
