name: Temporary native doc reader fix

on:
  push:
    branches:
      - feature/native-doc-reader-fix

permissions:
  contents: write

jobs:
  apply-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply document reader update
        run: python3 tools/tmp_apply_native_doc_reader_fix.py

      - name: Verify expected renderer features
        run: |
          grep -q 'MarkdownBlock.Table' apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/StandardImportFormatScreen.kt
          grep -q 'HTML_ANCHOR' apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/StandardImportFormatScreen.kt
          grep -q 'ClickableText' apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/StandardImportFormatScreen.kt

      - name: Build native debug
        working-directory: apps/android
        run: bash ./gradlew assembleNativeDebug

      - name: Create minimal replacement ZIP
        run: |
          zip -r Shiroha_Quiz_文档阅读优化_最小更新包.zip \
            apps/android/app/src/native/java/com/yiqiu/shirohaquiz/ui/screens/StandardImportFormatScreen.kt \
            apps/android/app/src/native/assets/docs/standard_format.md \
            apps/android/app/src/native/assets/docs/import_format_support.md
          sha256sum Shiroha_Quiz_文档阅读优化_最小更新包.zip | tee Shiroha_Quiz_文档阅读优化_最小更新包.sha256.txt

      - name: Upload minimal package
        uses: actions/upload-artifact@v4
        with:
          name: Shiroha_Quiz_doc_reader_minimal_update
          path: |
            Shiroha_Quiz_文档阅读优化_最小更新包.zip
            Shiroha_Quiz_文档阅读优化_最小更新包.sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary migration files
        run: |
          rm -f tools/tmp_apply_native_doc_reader_fix.py
          rm -f .github/workflows/tmp-native-doc-reader-fix.yml

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(native): improve offline Markdown document rendering"
          git push origin HEAD:${GITHUB_REF_NAME}
